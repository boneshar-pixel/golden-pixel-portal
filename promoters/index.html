<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة المروّجين — جولدن بيكسل (نموذج تفاعلي)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F3F4F6;--card:#FFFFFF;--ink:#1C1D21;--ink2:#3A3D45;--muted:#5A5E68;--line:#E3E5EA;--line2:#ECEEF2;--orange:#F28A0A;--orange-ink:#A85400;--tint:#FFF1DC;--ok-bg:#E1F3E8;--ok:#0B5E33;--warn-bg:#FFF1DC;--warn:#8A4600}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:var(--orange-ink)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.app{display:flex;min-height:100vh}
.side{width:264px;flex:none;background:var(--card);border-inline-end:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand img{width:44px;height:44px;object-fit:contain}
.brand b{display:block;font-size:17px;line-height:1.3}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border:none;background:transparent;border-radius:10px;font-weight:500;color:var(--ink2);text-align:right;width:100%}
.nav button:hover{background:var(--bg)}
.nav button[aria-current="page"]{background:var(--tint);color:var(--ink);font-weight:700}
.nav button[aria-current="page"] svg{stroke:var(--orange-ink)}
.subnav{display:flex;flex-direction:column;gap:2px;padding-inline-start:20px}
.subnav button{min-height:44px;font-size:14px}
.subnav button[aria-pressed="true"]{background:var(--tint);font-weight:700;color:var(--ink)}
.logo{display:inline-flex;align-items:center;gap:4px;flex:none;background:#fff;border-radius:8px;padding:3px 4px;box-shadow:0 0 0 1px var(--line)}
.logo img{height:22px;width:auto;display:block;border-radius:5px}
.logo.s{padding:2px 3px;border-radius:6px}.logo.s img{height:16px;border-radius:4px}
.manager{margin-top:auto;background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.manager small{color:var(--muted);font-size:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:22px 32px 0}
.top .who{display:flex;align-items:center;gap:12px}
.top .who img{display:none;width:38px;height:38px;object-fit:contain}
.top h1{font-size:24px;line-height:1.3}
.top p{color:var(--muted);font-size:14px}
.tools{display:flex;align-items:center;gap:10px;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid #D5D8DF;background:var(--card);font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--ink);font-weight:700}
.btn.primary:hover{background:#FF9A1F}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.icon{width:46px;padding:0;position:relative}
.dot{position:absolute;top:9px;inset-inline-end:10px;width:9px;height:9px;border-radius:50%;background:var(--orange);border:2px solid #fff}
.notif{position:absolute;top:54px;inset-inline-end:0;width:min(340px,86vw);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:8px;z-index:20;display:none}
.notif.open{display:block}
.notif button{display:block;width:100%;text-align:right;border:none;background:transparent;border-radius:10px;padding:12px;min-height:44px}
.notif button:hover{background:var(--bg)}
.notif small{display:block;color:var(--muted);font-size:12px}
#view{padding:22px 32px 48px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.balance{background:var(--ink);color:#fff;border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:16px}
.balance .row{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:14px}
.balance .lbl{font-size:14px;color:#C9CCD3}
.balance .big{font-size:44px;font-weight:700;line-height:1.15;display:block;text-align:right}
.bar{height:10px;background:#3A3C44;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);border-radius:99px}
.balance .foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:14px;color:#C9CCD3}
.balance .foot b{color:#fff}.balance .foot .hot{color:#FFB454}
.pbar{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.pbar button{flex:1 1 170px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 12px;border:none;border-radius:10px;background:transparent;font-weight:600;white-space:nowrap}
.pbar button:hover{background:var(--bg)}
.pbar button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pbar small{font-weight:500;font-size:13px}
.pbar .sm{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:14px;color:var(--muted)}
.kpi .val{font-size:28px;font-weight:700;text-align:right;display:block}
.kpi small{color:var(--muted);font-size:13px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.head h2{font-size:18px}
.head small{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:13px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td{padding:14px 12px;border-bottom:1px solid var(--line2)}
th.n,td.n{text-align:left}
td.n{direction:ltr;white-space:nowrap}
.ledger{min-width:480px}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFAFB}
.link{border:none;background:none;padding:0;font-weight:700;text-align:right;color:var(--ink);text-decoration:underline;text-decoration-color:#C9CCD3;text-underline-offset:4px;min-height:32px}
.link:hover{color:var(--orange-ink)}
.plat{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.sq{width:10px;height:10px;border-radius:3px;flex:none}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.st-active{background:var(--ok-bg);color:var(--ok)}
.st-paused{background:var(--line2);color:var(--ink2)}
.st-review,.st-pending{background:var(--warn-bg);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid #D5D8DF;background:var(--card);font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.field input,.field select,.field textarea{min-height:46px;border:1px solid #C3C7D0;border-radius:10px;padding:10px 12px;background:#fff;width:100%}
.field textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #F9B55A;outline-offset:2px}
.cards{display:none;flex-direction:column;gap:10px}
.ccard{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.ccard .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ccard .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line2);margin-top:10px;padding-top:10px}
.ccard .g small{display:block;color:var(--muted);font-size:12px}
.ccard .g b{display:block;text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--bg);border-radius:12px;padding:14px}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font-size:20px;display:block;text-align:right}
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ad{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.ad .ph{height:170px;background:repeating-linear-gradient(135deg,#ECEEF2 0 12px,#F6F7F9 12px 24px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
.ad .b{padding:14px;display:flex;flex-direction:column;gap:8px}
.ad .r{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.eq{display:flex;flex-wrap:wrap;align-items:stretch;gap:14px}
.eq>div{flex:1 1 180px}
.eq .op{flex:none;display:flex;align-items:center;font-size:30px;color:var(--muted)}
.eq .res{background:var(--ink);color:#fff;border-radius:12px;padding:16px 20px}
.eq .res .val{color:#FFB454}.eq .res .lbl,.eq .res small{color:#C9CCD3}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:20px;align-items:start}
.dep{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2)}
.dep .ic{width:42px;height:42px;flex:none;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.dep .mid{flex:1;min-width:0}
.dep small{display:block;color:var(--muted);font-size:13px}
.dep .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
tr.in td{background:#F1F9F4}
.share{height:8px;background:var(--line2);border-radius:99px;overflow:hidden;min-width:90px}
.share i{display:block;height:100%;border-radius:99px}
details{border-bottom:1px solid var(--line2)}
summary{min-height:50px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details p{color:var(--ink2);padding-bottom:14px}
.note{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);padding:18px 0}
.back{align-self:flex-start}
.overlay{position:fixed;inset:0;background:rgba(20,21,24,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:16px;padding:24px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.modal .acts{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
.ways{border:none;padding:0;margin:0;min-width:0}
.ways legend{font-size:14px;font-weight:600;padding:0;margin-bottom:6px}
.wrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.way{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:10px 6px;border:2px solid transparent;border-radius:12px;font-weight:700;text-align:center;cursor:pointer;color:var(--ink)}
.way.qi{background:#FFD400}.way.fib{background:#77BDA5}.way.neo{background:#E6DBFF}.way.zain{background:#4B1D8F;color:#fff}
.way:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.way.off{cursor:not-allowed}
.way input{width:18px;height:18px;accent-color:#1C1D21;margin:0}
.way small{display:block;font-size:12px;font-weight:600;background:#fff;color:#1C1D21;border-radius:99px;padding:1px 10px;margin-top:4px}
.wayinfo{background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wayinfo:empty{display:none}
.kv{display:flex;align-items:center;gap:8px}
.kv span{color:var(--muted);font-size:13px;flex:0 0 68px}
.kv b{flex:1;min-width:0;font-size:15px;text-align:right;white-space:nowrap}
.wa{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line2)}
.wa:first-of-type{border-top:none;padding-top:0}
.btn.wabtn{background:#25D366;border-color:#25D366;color:#10241A;font-weight:700}
.btn.wabtn:hover{background:#1FC15B}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.qrbox{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.qrbox>span{color:var(--muted);font-size:14px}
.qrbox small{color:var(--muted);font-size:12px}
.qr{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px;cursor:zoom-in}
.qr img{display:block;width:132px;height:auto}
.zoombox{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:min(460px,100%)}
.zoombox img{width:100%;height:auto;max-height:70vh;object-fit:contain;display:block}
.err{color:#A1260D;font-size:14px;font-weight:600;min-height:20px}
.toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;max-width:90vw;display:none;font-weight:500}
.toast.open{display:block}
.bottom{display:none}
.proto{background:var(--tint);color:var(--warn);font-size:13px;font-weight:600;text-align:center;padding:6px 12px}
@media (max-width:860px){
 .side{display:none}
 .wrow{gap:6px}.way{font-size:13px;padding:8px 2px}.modal{padding:18px}
 .top{padding:14px 16px 0;flex-wrap:nowrap;align-items:flex-start}.top .who{flex:1;min-width:0}.ledger{min-width:0;font-size:13px}.ledger th,.ledger td{padding:10px 5px}.top h1{font-size:19px}.top .who img{display:block}.top .period{display:none}
 #view{padding:16px 16px 100px;gap:14px}
 .balance{padding:20px}.balance .big{font-size:36px}.balance .row .btn{width:100%}
 .pbar{border:none;background:transparent;padding:0}
 .pbar button{flex:1 1 auto;min-height:46px;border:1px solid #D5D8DF;background:var(--card);border-radius:99px}
 .pbar button[aria-pressed="true"]{border-color:var(--ink)}.pbar .lg,.pbar small{display:none}.pbar .sm{display:inline}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi .val{font-size:21px}.card{padding:16px}
 .tbl{display:none}.cards{display:flex}
 .two{grid-template-columns:minmax(0,1fr)}
 .eq .op{display:none}
 .bottom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
 .bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:none;background:none;font-size:11.5px;font-weight:500;color:var(--ink2)}
 .bottom button[aria-current="page"]{color:var(--orange-ink);font-weight:700}
 .toast{bottom:84px}
}

.tm{white-space:nowrap}
.st-info{background:#E3ECFF;color:#1B3F99}.st-bad{background:#FDE7E2;color:#A1260D}
.plat-note{margin-top:auto;display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:12px;font-size:13px;font-weight:600;color:var(--ink2)}
.walletchip b{margin-inline-start:4px}
.alerts{border-color:#F3C98B;background:#FFFAF1}
.alerts h2{display:flex;align-items:center;gap:8px;color:var(--warn)}
.al{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #F5E2C4}
.al>span{flex:1 1 240px}
.dep .btn.sm{flex:none}
.sim{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.sim>div{flex:1 1 260px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.three.two-f{grid-template-columns:repeat(2,minmax(0,1fr));max-width:640px}
.say{background:var(--bg);border-radius:10px;padding:12px 14px;margin:14px 0 0;color:var(--ink2)}
.ac .err{margin-top:8px}
.ac>.btn{margin-top:4px}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px;font-weight:600}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:52px;height:30px;border-radius:99px;background:#B9BDC7;position:relative;transition:background .15s;flex:none}
.sw .tr::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw input:checked+.tr{background:#0B8A4A}
.sw input:checked+.tr::after{inset-inline-start:25px}
.sw input:focus-visible+.tr{outline:3px solid #F9B55A;outline-offset:2px}
.sw input:disabled+.tr{opacity:.5}
.steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px;color:var(--ink2)}
.pick{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border:1px solid #C3C7D0;border-radius:10px;cursor:pointer;background:#fff}
.pick:has(input:checked){border-color:var(--orange);background:var(--tint)}
.pick input{width:20px;height:20px;accent-color:#A85400;margin:0;flex:none}
.pick>span:not(.pill){flex:1}
.pick small{display:block;color:var(--muted);font-size:13px}
.notif button span{display:block}
.modal .chips button{min-height:44px}
@media (max-width:860px){
 .three{grid-template-columns:minmax(0,1fr)}
 .tm{white-space:normal;font-size:12px;min-width:64px}.ledger .pill{font-size:12px;padding:2px 8px}
 .bottom.six{grid-template-columns:repeat(6,minmax(0,1fr))}
 .bottom.six button{font-size:10.5px}
}

/* ---- هوية أرقى: فحمي + ذهبي، بطاقة محفظة بنقشة بكسل ---- */
:root{--bg:#F5F6F8;--ink:#23242A;--ink2:#3B3D46;--line:#E6E7EB;--line2:#EEEFF2;--tint:#FCEBCF}
body{font-variant-numeric:tabular-nums}
h1,h2,.val,.brand b,.wcard .amt,.figs dd,.stat b{font-family:'Alexandria','IBM Plex Sans Arabic',system-ui,sans-serif}
.proto{background:#2F3138;color:#F2D3A2;font-weight:500;letter-spacing:0}
.side{background:var(--ink);border:none;color:#fff;padding:26px 16px}
.brand img{width:48px;height:48px;background:#fff;border-radius:13px;padding:6px}
.brand b{font-weight:600;font-size:16px}.brand span{color:#A9ADB8}
.nav{gap:4px}
.nav button{color:#C4C7D0;min-height:48px;border-radius:12px}
.nav button:hover{background:#30323A;color:#fff}
.nav button[aria-current="page"]{background:#30323A;color:#fff;font-weight:600}
.nav button[aria-current="page"] svg{stroke:var(--orange)}
.plat-note{background:#30323A;color:#E3E5EA}
.plat-note .logo{box-shadow:none}
.top{padding-top:28px}
.top h1{font-size:26px;font-weight:600}
#view{gap:24px;padding-top:26px}
.card{border-radius:18px;padding:26px}
.head{margin-bottom:18px}
.head h2{font-size:18px;font-weight:600}
.btn{border-radius:12px;font-weight:600}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#34363F}
.btn.gold{background:var(--orange);border-color:var(--orange);color:#23242A;font-weight:700}
.btn.gold:hover{background:#FF9A1F}
.btn.sm.primary{background:var(--ink)}
.link{text-decoration-color:#D5D8DF}
.pill{font-weight:600;padding:3px 11px}
th{font-weight:500}
.hero{display:grid;grid-template-columns:minmax(320px,430px) minmax(0,1fr);gap:24px;align-items:stretch}
.wcard{position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:22px;padding:26px;min-height:250px;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}
.wcard .px{position:absolute;inset-block:0;inset-inline-end:0;width:62%;display:grid;grid-template-columns:repeat(9,1fr);grid-auto-rows:1fr;gap:3px;padding:10px;z-index:-1;-webkit-mask-image:linear-gradient(to left,transparent 8%,#000 95%);mask-image:linear-gradient(to left,transparent 8%,#000 95%)}

function doTopup(a,amt,kind,note){W.bal=r2(W.bal-amt);W.net=r2(W.net+amt);a.bal=r2(a.bal+amt);log(kind,a.id,amt,note);}

function runAuto(){
 var done=[],fail=[];
 live().forEach(function(a){
  if(!a.auto.on||a.bal>=a.auto.min) return;
  if(W.bal-a.auto.amt<W.reserve){fail.push(a.name);log('fail',a.id,a.auto.amt,['رصيد المحفظة ينزل تحت حد الأمان '+money(W.reserve),'Wallet would fall below the safety limit of '+money(W.reserve)]);return;}
  doTopup(a,a.auto.amt,'auto',below(a.auto.min));done.push(a.name);
 });
 return {done:done,fail:fail};
}

 if(t.id==='dFile'){var pv=document.getElementById('dPrev'),f=t.files&&t.files[0];if(f){document.getElementById('dErr').textContent='';try{pv.src=URL.createObjectURL(f);pv.style.display='block';}catch(x){}}else{pv.style.display='none';}}
 if(t.dataset&&t.dataset.toggle){
  var a=acc(+t.dataset.toggle);a.auto.on=t.checked;
  var mn=val('mn'+a.id),am=val('am'+a.id);if(mn>0&&am>0){a.auto.min=r2(mn);a.auto.amt=r2(am);}
  var r=a.auto.on?runAuto():{done:[],fail:[]};alertsExtra=r.fail;render(true);
  toast(a.auto.on?(L('تفعّلت التعبئة التلقائية على '+a.name+'.','Auto top-up is on for '+a.name+'.')+(r.done.length?L(' وتعبّى الآن لأن رصيده تحت الحد.',' It was topped up now because its balance is below the minimum.'):'')):L('توقفت التعبئة التلقائية على '+a.name+'.','Auto top-up is off for '+a.name+'.'));
 }
 if(t.name==='dAcc'){distPrev();}
});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='q'){S.q=t.value.trim();document.getElementById('list').innerHTML=accTable(filtered());document.getElementById('accCount').textContent=cAcc(filtered().length);}
 if(t.id==='tAmt'){var a=val('tAmt');document.getElementById('tPrev').innerHTML=a>0?L('رصيد المحفظة بعد التعبئة: ','Wallet balance after the top-up: ')+'<b class="num">'+money(r2(W.bal-a))+'</b>':L('اكتب المبلغ حتى تشوف رصيد المحفظة بعد التعبئة.','Enter an amount to see your wallet balance after the top-up.');}
 if(t.id==='dTot'){distPrev();}
});
document.addEventListener('submit',function(e){
 e.preventDefault();
 var f=e.target.id;
 if(f==='topForm'){
  var a=acc(+document.getElementById('tAcc').value), m=val('tAmt');
  if(!(m>0)){err('tErr',L('اكتب مبلغ التعبئة بالأرقام، مثال: 100','Enter the top-up amount as a number, for example 100'),'tAmt');return;}
  if(m>W.bal){err('tErr',L('المبلغ أكبر من رصيد محفظتك ('+money(W.bal)+'). قلّل المبلغ أو اطلب إيداع.','That is more than your wallet balance ('+money(W.bal)+'). Lower the amount or request a deposit.'),'tAmt');return;}
  doTopup(a,r2(m),'manual',null);closeModal();render(true);toast(L('تعبّى '+a.name+' بمبلغ '+money(m)+'. رصيده صار '+money(a.bal)+'.','Topped up '+a.name+' with '+money(m)+'. Its balance is now '+money(a.bal)+'.'));
 }
 if(f==='refForm'){
  var b=acc(+e.target.dataset.id), x=val('rAmt');
  if(!(x>0)){err('rErr',L('اكتب المبلغ بالأرقام، مثال: 50','Enter the amount as a number, for example 50'),'rAmt');return;}
  if(x>b.bal){err('rErr',L('المبلغ أكبر من رصيد الحساب ('+money(b.bal)+').','That is more than the account balance ('+money(b.bal)+').'),'rAmt');return;}
  doRefund(b,r2(x));closeModal();render(true);toast(L('رجع '+money(x)+' من '+b.name+' إلى محفظتك.','Refunded '+money(x)+' from '+b.name+' to your wallet.'));
 }
 if(f==='distForm'){
  var p=picked(), tot=val('dTot');
  if(!p.length){err('dErr2',L('اختر حساب واحد على الأقل.','Select at least one account.'));return;}
  if(!(tot>0)){err('dErr2',L('اكتب المبلغ الكلي بالأرقام، مثال: 300','Enter the total amount as a number, for example 300'),'dTot');return;}
  if(tot>W.bal){err('dErr2',L('المبلغ أكبر من رصيد محفظتك ('+money(W.bal)+').','That is more than your wallet balance ('+money(W.bal)+').'),'dTot');return;}
  var s=split(r2(tot),p.length);p.forEach(function(a,i){doTopup(a,s[i],'manual',['توزيع على '+p.length+' حسابات','Split across '+p.length+' accounts']);});
  closeModal();render(true);toast(L('توزّع '+money(tot)+' على ','Distributed '+money(tot)+' across ')+cAcc(p.length)+'.');
 }
 if(f==='newForm'){
  var nm=document.getElementById('nName').value.trim();
  if(!nm){err('nErr',L('اكتب اسم النشاط أو المتجر.','Enter the business or store name.'),'nName');return;}
  requests.unshift(nm);closeModal();S.view='accounts';S.acc=null;render();toast(L('تسجّل طلب الحساب بالنموذج، ويظهر تحت «طلباتك».','Account request recorded in the demo. It appears under “Your requests”.'));
 }
 if(f==='depForm'){
  var am=val('dAmt');
  if(!(am>0)){err('dErr',L('اكتب مبلغ الإيداع بالدينار وبالأرقام، مثال: 150000','Enter the deposit amount in dinar as a number, for example 150000'),'dAmt');return;}
  var fl=document.getElementById('dFile').files;
  if(!fl||!fl.length){err('dErr',L('ارفع صورة الحوالة حتى نگدر نأكد الإيداع.','Upload the transfer receipt so we can confirm the deposit.'),'dFile');return;}
  deposits.unshift({d:now(),way:document.querySelector('input[name=way]:checked').value,amt:am,iqd:true,st:'wait'});
  closeModal();go('wallet');toast(L('تسجّل الطلب بالنموذج، ويظهر بسجل الإيداعات «بانتظار التأكيد».','Request recorded in the demo. It shows in deposit history as “Awaiting confirmation”.'));
 }
});
function fromHash(){var h=(location.hash||'').replace('#','');if(VIEWS[h]&&h!==S.view){S.view=h;S.acc=null;render();}}
window.addEventListener('hashchange',fromHash);
var h0=(location.hash||'').replace('#','');if(VIEWS[h0])S.view=h0;
render();
})();
</script>
</body>
