<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جولدن بيكسل — اختر منصتك</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--ink:#17181C;--muted:#5A5E68;--line:#E3E5EA;--orange:#F28A0A;--deep:#A8481C}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#FAFAFA;color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.6}
h1,h2,.h{font-family:'Alexandria','IBM Plex Sans Arabic',system-ui,sans-serif;margin:0}
p{margin:0}
.wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pick{display:flex;flex-direction:column;padding:44px 56px 40px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-family:'Alexandria',sans-serif;font-weight:600;font-size:22px;direction:ltr}
.brand img{width:40px;height:40px;object-fit:contain}
.lang{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:none;background:transparent;border-radius:99px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.lang:hover{background:#EEEFF2;color:var(--ink)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:520px;margin:0 auto;padding:40px 0}
.mid h1{font-size:44px;font-weight:600;line-height:1.25}
.mid>p{color:var(--muted);font-size:17px;margin:10px 0 34px}
.opts{display:flex;flex-direction:column;gap:16px}
.opt{display:flex;align-items:center;gap:18px;padding:22px 24px;background:#fff;border:1.5px solid var(--line);border-radius:22px;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--orange);transform:translateY(-2px)}
.opt:focus-visible,.lang:focus-visible,.team:focus-visible{outline:3px solid #F9B55A;outline-offset:3px}
.ico{width:58px;height:58px;flex:none;border-radius:17px;display:flex;align-items:center;justify-content:center}
.opt.c .ico{background:#FCEBCF;color:#A85400}
.opt.p .ico{background:#17181C;color:#F28A0A}
.txt{flex:1;min-width:0}
.txt b{display:block;font-family:'Alexandria',sans-serif;font-weight:600;font-size:20px;line-height:1.4}
.txt span{display:block;color:var(--muted);font-size:14.5px;margin-top:2px}
.go{flex:none;width:44px;height:44px;border-radius:50%;background:#F3F4F7;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.opt:hover .go{background:var(--orange)}
[dir="ltr"] .go svg{transform:scaleX(-1)}
.team{align-self:center;color:var(--muted);font-size:15px;min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px}
.show{margin:14px;border-radius:44px;color:#fff;padding:120px 96px 80px;display:flex;flex-direction:column;justify-content:space-between;gap:48px;background:
 radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.6px) 0 0/22px 22px,
 linear-gradient(155deg,#EE9A45 0%,#DE6C2A 38%,#C7551F 68%,#A8481C 100%)}
.show h2{font-size:64px;font-weight:600;line-height:1.2}
.show h2 em{font-style:normal;color:#FFE1C4}
.show .lead{font-size:20px;margin-top:22px;max-width:30em}
.pts{list-style:none;margin:34px 0 0;padding:0;display:flex;flex-direction:column;gap:16px;font-size:17px;font-weight:500}
.pts li{display:flex;align-items:center;gap:14px}
.pts i{width:30px;height:30px;flex:none;border-radius:50%;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
.chart{background:#fff;color:var(--ink);border-radius:28px;padding:28px 30px 0;box-shadow:0 0 0 8px rgba(255,255,255,.18)}
.chart .top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.live{display:inline-flex;align-items:center;gap:8px;background:#E6F4EA;color:#17633A;border-radius:99px;padding:3px 12px;font-size:13.5px;font-weight:600}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:#2E9E5B}
.bars{direction:ltr;display:flex;align-items:flex-end;gap:14px;height:170px;margin-top:22px}
.bars i{flex:1;border-radius:6px 6px 0 0;background:#FADFD0}
.bars i:last-child{background:linear-gradient(#F09A4C,#DE6C2A)}
@media (max-width:980px){
 .wrap{grid-template-columns:minmax(0,1fr)}
 .pick{padding:22px 20px 28px;min-height:auto}
 .mid{padding:36px 0 28px}.mid h1{font-size:32px}.mid>p{font-size:15.5px;margin-bottom:24px}
 .opt{padding:18px;gap:14px;border-radius:20px}.ico{width:50px;height:50px;border-radius:15px}.txt b{font-size:17px}.txt span{font-size:13.5px}.go{width:40px;height:40px}
 .show{margin:0 12px 12px;border-radius:30px;padding:44px 26px 30px;gap:30px}
 .show h2{font-size:36px}.show .lead{font-size:16px;margin-top:14px}.pts{font-size:15px;margin-top:22px;gap:12px}
 .chart{padding:20px 20px 0;border-radius:22px}.bars{height:110px;gap:8px}
}
@media (prefers-reduced-motion:reduce){.opt{transition:none}.opt:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <main class="pick">
    <div class="bar">
      <div class="brand"><img src="logo.png" alt=""><span>Golden Pixel</span></div>
      <button class="lang" type="button" id="lang"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.200 3 14.800 0 18M12 3c-3 3.200-3 14.800 0 18"/></svg><span id="langTxt"></span></button>
    </div>
    <div class="mid">
      <h1 data-ar="اختر منصتك" data-en="Choose your platform"></h1>
      <p data-ar="ادخل على المنصة المناسبة لنوع حسابك." data-en="Enter the platform that matches your account."></p>
      <div class="opts">
        <a class="opt c" href="client/index.html">
          <span class="ico" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11"/><path d="M10 20V5"/><path d="M16 20v-7"/><path d="M21 20H3"/></svg></span>
          <span class="txt"><b data-ar="منصة العميل" data-en="Client platform"></b><span data-ar="نحن ندير حملاتك، وأنت تتابع إعلاناتك ورصيدك وصرفك اليومي." data-en="We run your campaigns. You follow your ads, balance and daily spend."></span></span>
          <span class="go" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></span>
        </a>
        <a class="opt p" href="promoters/index.html">
          <span class="ico" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l8 5V5l-8 5H4z"/><path d="M18.500 9a4 4 0 010 6"/></svg></span>
          <span class="txt"><b data-ar="منصة الترويج" data-en="Advertiser platform"></b><span data-ar="تاخذ حسابات إعلانية وتروّج بنفسك، وتعبّيها من محفظتك." data-en="You get ad accounts and run your own ads, topping them up from your wallet."></span></span>
          <span class="go" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></span>
        </a>
      </div>
    </div>
    <a class="team" href="#" data-ar="لوحة الفريق" data-en="Team dashboard"></a>
  </main>
  <aside class="show">
    <div>
      <h2><span data-ar="مبيعاتك، " data-en="Your sales, "></span><em data-ar="مباشرة." data-en="live."></em></h2>
      <p class="lead" data-ar="الطلبات، والإنفاق الإعلاني، وتكلفة كل طلب، لحظة تغيّرها." data-en="Orders, ad spend and cost per order, the moment they change."></p>
      <ul class="pts">
        <li><i aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></i><span data-ar="كل حملة وكل فيديو بأرقامه" data-en="Every campaign and every video with its numbers"></span></li>
        <li><i aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></i><span data-ar="ميزانيتك الإعلانية وكل عملية شحن مسجّلة" data-en="Your ad budget and every top-up on record"></span></li>
        <li><i aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></i><span data-ar="خاصة بك وبفريقك في غولدن بيكسل" data-en="Private to you and your team at Golden Pixel"></span></li>
      </ul>
    </div>
    <div class="chart" role="img" aria-label="">
      <div class="top"><span data-ar="الإنفاق الإعلاني يومياً" data-en="Daily ad spend"></span><span class="live" data-ar="نشطة" data-en="Active"></span></div>
      <div class="bars" aria-hidden="true"><i style="height:38%"></i><i style="height:46%"></i><i style="height:42%"></i><i style="height:55%"></i><i style="height:61%"></i><i style="height:58%"></i><i style="height:70%"></i><i style="height:64%"></i><i style="height:77%"></i><i style="height:83%"></i><i style="height:79%"></i><i style="height:88%"></i><i style="height:96%"></i><i style="height:90%"></i></div>
    </div>
  </aside>
</div>
<script>
(function(){
 var LANG='ar';
 try{var s=localStorage.getItem('gp-lang');if(s==='en'||s==='ar')LANG=s;}catch(e){}
 function apply(){
  var en=LANG==='en';
  document.documentElement.lang=LANG;document.documentElement.dir=en?'ltr':'rtl';
  document.title=en?'Golden Pixel — choose your platform':'جولدن بيكسل — اختر منصتك';
  Array.prototype.forEach.call(document.querySelectorAll('[data-ar]'),function(e){e.textContent=en?e.dataset.en:e.dataset.ar;});
  document.getElementById('langTxt').textContent=en?'العربية':'English';
  document.getElementById('lang').setAttribute('lang',en?'ar':'en');
  document.querySelector('.chart').setAttribute('aria-label',en?'Sample chart of daily ad spend rising over two weeks':'مخطط تجريبي للإنفاق الإعلاني اليومي يرتفع خلال أسبوعين');
 }
 document.getElementById('lang').addEventListener('click',function(){LANG=LANG==='en'?'ar':'en';try{localStorage.setItem('gp-lang',LANG);}catch(e){}apply();});
 apply();
})();
</script>
</body>
</html>
